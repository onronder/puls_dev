openapi: 3.1.0
info:
  title: PULS App API Boundary
  version: 12.1.0
  description: |
    PR12.1 contract-path OpenAPI draft derived from PR12.0 boundary inventory.
    Current transport is supabase-js (Postgres RPC + table writes), not public HTTP REST.
servers:
  - url: supabase-js://local
    description: Current in-app Supabase client transport, not public HTTP
security:
  - SupabaseJwt: []
x-puls-source-inventory: docs/data/12_app_api_boundary_inventory.md
x-puls-public-http: false
x-puls-current-transport: supabase-js
x-puls-generated-from: PR12.0 boundary inventory
x-puls-examples-doc: docs/api/openapi-examples.yaml
x-puls-error-catalog: docs/api/puls-error-catalog.md

paths:

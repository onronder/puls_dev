      x-puls-boundary-class: app_exposed_mutation
      x-puls-transport: supabase_rpc
      x-puls-backend: puls_workflow.create_expense_claim
      x-puls-auth:
        type: SupabaseJwt
        requiresTenantContext: true
        requiresEmployeeContext: true
      security:
        - SupabaseJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseClaimRequest'
      responses:
        '200':
          description: Expense claim created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExpenseClaimResponse'
        default:
          description: Adapter or RPC error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


components:
  securitySchemes:
    SupabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          oneOf:
            - $ref: '#/components/schemas/DataAdapterError'
            - $ref: '#/components/schemas/RpcError'
            - $ref: '#/components/schemas/ValidationError'

    DataAdapterError:
      type: object
      required:
        - code
        - message
        - source
        - operation
      properties:
        code:
          type: string
          description: |
            Domain error code. Examples include PULS_AUTH_REQUIRED, PULS_EXPENSE_CATEGORY_NOT_FOUND,
            PULS_LEAVE_TYPE_IN_USE_ACTIVE_REQUESTS, and invalid_rpc_result when RPC return shape is invalid.
          examples:
            - PULS_AUTH_REQUIRED
            - invalid_rpc_result
        message:
          type: string
        source:
          type: string
          enum:
            - adapter
            - rpc
            - supabase
        operation:
          type: string
        i18nKey:
          type: string
          nullable: true

    RpcError:
      type: object
      description: PostgREST/RPC failure shape surfaced via fromRpcError
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: string
          nullable: true
        hint:
          type: string
          nullable: true

    ValidationError:
      type: object
      description: Field-level validation errors
      properties:
        fieldErrors:
          type: object
          additionalProperties:
            type: string

    CreateExpenseClaimRequest:
      type: object
      required:
        - categoryId
        - amount
        - expenseDate
      properties:
        categoryId:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        amount:
          type: number
        currency:
          type: string
          default: TRY
        vatRate:
          type: number
          nullable: true
        vatIncluded:
          type: boolean
          default: true
        expenseDate:
          type: string
          format: date
        description:
          type: string
          nullable: true

    CreateExpenseClaimResponse:
      type: object
      required:
        - expenseClaimId
        - approvalRequestId
        - policyStatus
        - status
        - title
      properties:
        expenseClaimId:
          type: string
          format: uuid
        approvalRequestId:
          type: string
          format: uuid
        policyStatus:
          type: string
        status:
          type: string
        title:
          type: string

    CreateLeaveRequestRequest:
      type: object
      required:
        - leaveTypeId
        - startDate
        - endDate
      properties:
        leaveTypeId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        halfDay:
          type: boolean
          default: false
        delegateEmployeeId:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
          nullable: true

    CreateLeaveRequestResponse:
      type: object
      required:
        - leaveRequestId
        - approvalRequestId
        - businessDays
        - status
        - approverEmployeeId
        - approverName
      properties:
        leaveRequestId:
          type: string
          format: uuid
        approvalRequestId:
          type: string
          format: uuid
        businessDays:
          type: number
        status:
          type: string
        approverEmployeeId:
          type: string
          format: uuid
        approverName:
          type: string
          nullable: true

    DecideApprovalRequestRequest:
      type: object
      required:
        - approvalRequestId
        - decision
      properties:
        approvalRequestId:
          type: string
          format: uuid
        decision:
          type: string
          enum:
            - approved
            - rejected
        note:
          type: string
          nullable: true

    DecideApprovalRequestResponse:
      type: object
      required:
        - module
        - parentId
        - status
        - approvalRequestId
        - final
      properties:
        module:
          type: string
          enum:
            - leave
            - expense
        parentId:
          type: string
          format: uuid
        status:
          type: string
        approvalRequestId:
          type: string
          format: uuid
        final:
          type: boolean
        nextApprovalRequestId:
          type: string
          format: uuid
          nullable: true
        currentStepOrder:
          type: integer
          nullable: true

    ExpenseCategoryMutationRequest:
      type: object
      required:
        - name
        - code
        - monthlyLimit
        - receiptRequiredOver
      properties:
        name:
          type: string
        code:
          type: string
        monthlyLimit:
          type: number
        receiptRequiredOver:
          type: number
        erpAccountCode:
          type: string
          nullable: true

    ExpenseCategoryLifecycleRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          nullable: true

    ExpenseCategoryLifecycleResponse:
      oneOf:

name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.3 --activate

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm audit --audit-level high
      - name: Audit Supabase schema
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm run audit:supabase
      - run: pnpm run build
      - run: pnpm run check-i18n

  playwright:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.3 --activate

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm run test:e2e

  playwright-authenticated:
    runs-on: ubuntu-latest
    needs: quality
    env:
      E2E_BASE_URL: https://puls-dev.vercel.app
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_HR_EMAIL: ${{ secrets.E2E_HR_EMAIL }}
      E2E_HR_PASSWORD: ${{ secrets.E2E_HR_PASSWORD }}
      E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
      E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
      E2E_EMPLOYEE_EMAIL: ${{ secrets.E2E_EMPLOYEE_EMAIL }}
      E2E_EMPLOYEE_PASSWORD: ${{ secrets.E2E_EMPLOYEE_PASSWORD }}
      E2E_CONNECTOR_ADMIN_EMAIL: ${{ secrets.E2E_CONNECTOR_ADMIN_EMAIL }}
      E2E_CONNECTOR_ADMIN_PASSWORD: ${{ secrets.E2E_CONNECTOR_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.3 --activate

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium

      - name: Run authenticated e2e
        if: env.E2E_EMAIL != '' && env.E2E_PASSWORD != ''
        run: pnpm run test:e2e:auth

      - name: Authenticated e2e not configured
        if: env.E2E_EMAIL == '' || env.E2E_PASSWORD == ''
        run: |
          echo "::notice::Authenticated e2e skipped. Configure E2E_EMAIL and E2E_PASSWORD repository secrets to enable live auth coverage."
